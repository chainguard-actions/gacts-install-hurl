# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# docs: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions

name: 🧪 Tests

on:
  push:
    branches: [master, main]
    tags-ignore: ['**']
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env: {FORCE_COLOR: 'true'}

jobs:
  gitleaks:
    name: Check for GitLeaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - {uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        , with: {fetch-depth: 0}}
      - uses: gacts/gitleaks@c9a0338361dc45a01aa7ebaaa5330179f3c62873 # v1

  eslint:
    name: Run code linter
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - {uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        , with: {node-version-file: ./package.json, cache: 'npm'}}
      - run: npm install
      - run: npm run lint

  dist-built:
    name: Check distributive built state
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dist-changed: ${{ steps.state.outputs.changed }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - {uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        , with: {node-version-file: ./package.json, cache: 'npm'}}
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with: {name: dist, path: ./dist/, retention-days: 1}
      - id: state
        run: echo "changed=`git diff --diff-filter=ACMUXTR --name-only | grep dist/ > /dev/null && echo 'true' || echo 'false'`" >> $GITHUB_OUTPUT

  commit-and-push-fresh-dist:
    name: Commit and push fresh distributive
    needs: [dist-built]
    if: ${{ needs.dist-built.outputs.dist-changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with: {name: dist, path: ./dist/}
      - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with: {commit_message: Automatic distributive rebuild}

  run-this-action: # non-existing files will not generate an error
    name: 🚀 Run (${{ matrix.runs-on }}, ${{ matrix.version }}, !cache ${{ matrix.disable-cache }})
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-latest, macos-latest, windows-latest]
        version: [4.0.0, 4.1.0, 4.3.0, 5.0.1, 6.0.0, latest]
        disable-cache: [true, false]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Run this action
        uses: ./
        with: {version: '${{ matrix.version }}', disable-cache: '${{ matrix.disable-cache }}'}
      - run: hurl --version
