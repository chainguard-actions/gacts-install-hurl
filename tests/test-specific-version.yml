name: Test specific version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: 4.3.0
      - name: Assert hurl-bin output is set
        env:
          HURL_BIN: ${{ steps.action.outputs.hurl-bin }}
        run: |
          echo "hurl-bin: $HURL_BIN"
          if [ -z "$HURL_BIN" ]; then
            echo "FAIL: hurl-bin output is empty"
            exit 1
          fi
          echo "PASS: hurl-bin output is set"
      - name: Assert hurl binary exists and is executable
        env:
          HURL_BIN: ${{ steps.action.outputs.hurl-bin }}
        run: |
          echo "Checking binary at: $HURL_BIN"
          if [ ! -f "$HURL_BIN" ]; then
            echo "FAIL: hurl binary not found at $HURL_BIN"
            exit 1
          fi
          if [ ! -x "$HURL_BIN" ]; then
            echo "FAIL: hurl binary is not executable"
            exit 1
          fi
          echo "PASS: hurl binary exists and is executable"
      - name: Assert installed version matches requested version
        env:
          HURL_BIN: ${{ steps.action.outputs.hurl-bin }}
        run: |
          VERSION_OUTPUT="$("$HURL_BIN" --version 2>&1)"
          echo "version output: $VERSION_OUTPUT"
          if ! echo "$VERSION_OUTPUT" | grep -q "4.3.0"; then
            echo "FAIL: expected version 4.3.0 but got: $VERSION_OUTPUT"
            exit 1
          fi
          echo "PASS: installed version matches 4.3.0"
