name: Test specific version install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: 4.3.0
      - name: Assert hurl-bin output is set
        env:
          HURL_BIN: ${{ steps.action.outputs.hurl-bin }}
        run: |
          echo "hurl-bin: $HURL_BIN"
          if [ -z "$HURL_BIN" ]; then
            echo "FAIL: hurl-bin output is empty"
            exit 1
          fi
          echo "PASS: hurl-bin output is set to $HURL_BIN"
      - name: Assert hurl binary exists and is executable
        env:
          HURL_BIN: ${{ steps.action.outputs.hurl-bin }}
        run: |
          echo "Checking hurl binary at: $HURL_BIN"
          if [ ! -f "$HURL_BIN" ]; then
            echo "FAIL: hurl binary not found at $HURL_BIN"
            exit 1
          fi
          if [ ! -x "$HURL_BIN" ]; then
            echo "FAIL: hurl binary is not executable"
            exit 1
          fi
          echo "PASS: hurl binary exists and is executable"
      - name: Assert correct version is installed
        run: |
          INSTALLED_VERSION=$(hurl --version | head -1 | awk '{print $2}')
          echo "Installed version: $INSTALLED_VERSION"
          if [ "$INSTALLED_VERSION" != "4.3.0" ]; then
            echo "FAIL: expected version 4.3.0 but got $INSTALLED_VERSION"
            exit 1
          fi
          echo "PASS: correct version 4.3.0 is installed"
