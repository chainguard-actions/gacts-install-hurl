name: Test basic usage - install latest hurl
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: install
        name: Install hurl (latest)
        uses: .
        with:
          version: latest

      - name: Assert hurl-bin output is set
        env:
          HURL_BIN: ${{ steps.install.outputs.hurl-bin }}
        run: |
          echo "hurl-bin: $HURL_BIN"
          if [ -z "$HURL_BIN" ]; then
            echo "FAIL: hurl-bin output is empty"
            exit 1
          fi
          echo "PASS: hurl-bin output is set"

      - name: Assert hurl binary exists and is executable
        env:
          HURL_BIN: ${{ steps.install.outputs.hurl-bin }}
        run: |
          echo "Checking binary at: $HURL_BIN"
          if [ ! -f "$HURL_BIN" ]; then
            echo "FAIL: hurl binary file does not exist at $HURL_BIN"
            exit 1
          fi
          if [ ! -x "$HURL_BIN" ]; then
            echo "FAIL: hurl binary is not executable"
            exit 1
          fi
          echo "PASS: hurl binary exists and is executable"

      - name: Assert hurl is runnable and prints version
        env:
          HURL_BIN: ${{ steps.install.outputs.hurl-bin }}
        run: |
          echo "Running: $HURL_BIN --version"
          "$HURL_BIN" --version
          if [ $? -ne 0 ]; then
            echo "FAIL: hurl --version returned non-zero exit code"
            exit 1
          fi
          echo "PASS: hurl --version succeeded"

      - name: Assert hurl is on PATH
        run: |
          which hurl || (echo "FAIL: hurl not found on PATH" && exit 1)
          echo "PASS: hurl found on PATH at $(which hurl)"
