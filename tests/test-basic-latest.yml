name: Test install hurl - latest version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: install
        name: Install hurl (latest)
        uses: .
        with:
          version: latest

      - name: Assert hurl-bin output is set
        env:
          HURL_BIN: ${{ steps.install.outputs.hurl-bin }}
        run: |
          echo "hurl-bin: $HURL_BIN"
          if [ -z "$HURL_BIN" ]; then
            echo "FAIL: hurl-bin output is empty"
            exit 1
          fi
          echo "PASS: hurl-bin output is set to $HURL_BIN"

      - name: Assert hurl binary exists and is executable
        env:
          HURL_BIN: ${{ steps.install.outputs.hurl-bin }}
        run: |
          echo "Checking binary at: $HURL_BIN"
          if [ ! -f "$HURL_BIN" ]; then
            echo "FAIL: hurl binary not found at $HURL_BIN"
            exit 1
          fi
          if [ ! -x "$HURL_BIN" ]; then
            echo "FAIL: hurl binary is not executable"
            exit 1
          fi
          echo "PASS: hurl binary exists and is executable"

      - name: Assert hurl is runnable and reports a version
        env:
          HURL_BIN: ${{ steps.install.outputs.hurl-bin }}
        run: |
          VERSION_OUTPUT="$("$HURL_BIN" --version 2>&1 || true)"
          echo "hurl --version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -qiE 'hurl [0-9]+\.[0-9]+'; then
            echo "PASS: hurl reports a valid version"
          else
            echo "FAIL: unexpected version output: $VERSION_OUTPUT"
            exit 1
          fi
