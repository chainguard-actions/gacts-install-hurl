name: Test install with cache disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: latest
          disable-cache: true
      - name: Assert hurl-bin output is set
        env:
          HURL_BIN: ${{ steps.action.outputs.hurl-bin }}
        run: |
          echo "hurl-bin: $HURL_BIN"
          if [ -z "$HURL_BIN" ]; then
            echo "FAIL: hurl-bin output is empty"
            exit 1
          fi
          echo "PASS: hurl-bin output is set to $HURL_BIN"
      - name: Assert hurl binary exists and is executable
        env:
          HURL_BIN: ${{ steps.action.outputs.hurl-bin }}
        run: |
          echo "Checking hurl binary at: $HURL_BIN"
          if [ ! -f "$HURL_BIN" ]; then
            echo "FAIL: hurl binary not found at $HURL_BIN"
            exit 1
          fi
          if [ ! -x "$HURL_BIN" ]; then
            echo "FAIL: hurl binary is not executable"
            exit 1
          fi
          echo "PASS: hurl binary exists and is executable"
      - name: Assert hurl is runnable
        run: |
          hurl --version
          if [ $? -ne 0 ]; then
            echo "FAIL: hurl --version failed"
            exit 1
          fi
          echo "PASS: hurl is runnable with cache disabled"
